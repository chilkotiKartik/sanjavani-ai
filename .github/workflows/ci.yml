name: Build and Safety Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Typecheck, Test & Safety Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Secret Leakage Check
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit & Rule Tests
        run: npm test

      - name: Clinical Safety Vignette Evaluation (CI Thresholds)
        run: npm run eval
